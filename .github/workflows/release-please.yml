name: Release Please

# Maintains a release PR (version bump + CHANGELOG) from Conventional Commits
# on main. When that PR is merged, release-please cuts the GitHub release/tag
# and this workflow chains straight into release.yml in the same run — rather
# than relying on the new tag to trigger it, since tags created via
# GITHUB_TOKEN don't fire other workflows' push:tags events.

on:
  push:
    branches:
      - main

# A called workflow's permissions are intersected with the caller's — it can downscope but
# never widen — so id-token and pages must be granted here for release.yml and docs.yml to
# receive them.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # forwarded to release.yml for NuGet Trusted Publishing
  pages: write # forwarded to docs.yml for the GitHub Pages deployment

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Narrower than the workflow default: this job never needs pages or id-token.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Runs after publish, so the site only goes live for a version that actually reached NuGet.
  # Gated on build-test transitively: publish needs build-test inside release.yml.
  # No secrets: inherit — docs.yml uses only the job-scoped GITHUB_TOKEN.
  docs:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/docs.yml
