name: Release Please

# Maintains a release PR (version bump + CHANGELOG) from Conventional Commits
# on main. When that PR is merged, release-please cuts the GitHub release/tag
# and this workflow chains straight into release.yml in the same run — rather
# than relying on the new tag to trigger it, since tags created via
# GITHUB_TOKEN don't fire other workflows' push:tags events.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # forwarded to release.yml for NuGet Trusted Publishing

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
