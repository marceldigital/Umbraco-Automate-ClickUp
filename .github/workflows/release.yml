name: Release Package

# Runs when a correctly formatted tag is pushed (e.g. 0.1.0), or when called
# directly as a reusable workflow (e.g. by release-please.yml) after a release
# is cut. Tags created via GITHUB_TOKEN (as release-please does) don't trigger
# the push:tags event below, which is why the workflow_call path exists.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      version:
        description: 'Version to pack and publish (e.g. 0.1.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build & Pack
        run: dotnet pack src/Automate.ClickUp/Automate.ClickUp.csproj -c Release /p:Version=${{ inputs.version || github.ref_name }}

      - name: Push to NuGet
        run: dotnet nuget push **/*.nupkg -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
