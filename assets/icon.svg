<?xml version="1.0" encoding="UTF-8"?>
<!--
  Package icon for Umbraco.Community.Automate.ClickUp.

  A mash-up of the two marks this package bridges: the Umbraco Automate mark
  (rounded card plus two trailing arrowheads) rendered in reverse on an Automate
  indigo tile, with the ClickUp mark riding inside the card.

  Both marks are vector reconstructions traced from the official package icons
  on nuget.org (Umbraco.Automate 18.1.0 and Chinchilla.ClickUp 2.0.8.3);
  geometry was least-squares fitted to those sources, and the gradient stops
  were sampled from the ClickUp mark directly.

  Palette
    #283A97  Umbraco Automate indigo (tile)
    #F5C1BC  Umbraco Automate blush  (trailing arrowhead)
    #FF02F0 -> #FFC800  ClickUp chevron gradient
    #8930FD -> #49CCF9  ClickUp arc gradient

  Coordinate spaces, outermost first:
    512x512  tile
    128x128  Umbraco Automate mark  (translate/scale on the <g>)
    240x240  ClickUp mark           (translate/scale on the nested <g>)

  icon.png is the packaged raster (256x256) rendered from this file; re-render it
  with any SVG rasteriser after editing, e.g.
    inkscape assets/icon.svg -w 256 -h 256 -o assets/icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cu-chevron" gradientUnits="userSpaceOnUse" x1="59" y1="0" x2="181" y2="0">
      <stop offset="0" stop-color="#FF02F0"/>
      <stop offset="1" stop-color="#FFC800"/>
    </linearGradient>
    <linearGradient id="cu-arc" gradientUnits="userSpaceOnUse" x1="56.64" y1="0" x2="183.36" y2="0">
      <stop offset="0" stop-color="#8930FD"/>
      <stop offset="1" stop-color="#49CCF9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" ry="96" fill="#283A97"/>

  <!-- Umbraco Automate mark, in its native 128x128 space -->
  <g transform="translate(-57.681 -58.421) scale(4.93597)">
    <!-- card -->
    <path fill="#FFFFFF" d="M 27.19 44.14 A 4.88 4.88 0 0 1 32.79 40.19 L 65.02 45.52 A 4.88 4.88 0 0 1 69.04 51.12 L 63.64 84.16 A 4.88 4.88 0 0 1 57.89 88.16 L 25.31 81.83 A 4.88 4.88 0 0 1 21.44 76.18 Z"/>
    <!-- leading arrowhead -->
    <path fill="#FFFFFF" d="M 69.71 42.86 A 3.5 3.5 0 0 1 75.69 40.58 L 91.01 56.13 A 3.5 3.5 0 0 1 91.44 60.52 L 74.05 86.83 A 3.5 3.5 0 0 1 67.63 84.73 Z"/>
    <!-- trailing arrowhead -->
    <path fill="#F5C1BC" d="M 92.24 40.45 A 2.05 2.05 0 0 1 96.12 39.63 L 105.57 58.49 A 2.05 2.05 0 0 1 105.62 60.23 L 94.09 86.85 A 2.05 2.05 0 0 1 90.16 85.94 Z"/>

    <!-- ClickUp mark, in its native 240x240 space, inset into the card and
         rotated about the card's centroid to sit square to it. The card's four
         edges run 9.3-11.0 deg (the fitted quad is not an exact rectangle), so
         10 deg is within a degree of every edge. -->
    <g transform="rotate(10 45.32 63.94) translate(17.18 36.56) scale(0.23)">
      <path fill="url(#cu-chevron)" d="M 120 40 L 181 92 L 162 114 L 120 80 L 78 114 L 59 92 Z"/>
      <path fill="url(#cu-arc)" d="M 56.64 157.34 A 73.5 73.5 0 0 0 183.36 157.34 L 158.60 142.74 A 44.8 44.8 0 0 1 81.40 142.74 Z"/>
    </g>
  </g>
</svg>
